name: Test, build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiskas-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check version and tag
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content -Raw VERSION).Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          $releaseTag = "V$releaseVersion"
          git show-ref --verify --quiet "refs/tags/$releaseTag"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-list -n 1 $releaseTag
            if ($tagCommit -ne $env:GITHUB_SHA) { throw 'Increment VERSION before pushing a new revision.' }
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check desktop controls
        run: python scripts/smoke_gui.py
      - name: Build Windows executable
        run: python scripts/build.py
      - name: Verify bundled executable
        run: python scripts/verify_exe.py
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kiskas-${{ env.RELEASE_TAG }}-windows
          path: |
            kiskas.exe
            SHA256SUMS.txt
            ENTREGA.md
          if-no-files-found: error
      - name: Tag and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Could not create tag' }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push tag' }
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG kiskas.exe SHA256SUMS.txt ENTREGA.md --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG kiskas.exe SHA256SUMS.txt ENTREGA.md --verify-tag --title "Kiskas $env:RELEASE_TAG" --notes-file CHANGELOG.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
